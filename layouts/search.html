{{- define "main" }}
<header class="page-head shell">
  <div class="reveal">
    <div class="h-eyebrow"><span class="blink"></span>QUERY</div>
    <h1 class="page-title">search<span class="accent">.</span></h1>
    <p class="lede">{{ .Description | default "Find anything across every post." }}</p>
  </div>
</header>

<section class="shell">
  <div id="searchbox" class="searchbox">
    <input id="searchInput" disabled placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
      aria-label="search" type="search" autocomplete="off" maxlength="64">
    <ul id="searchResults" class="searchResults" aria-label="search results"></ul>
  </div>
</section>
{{- end }}{{/* end main */}}
